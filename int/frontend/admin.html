<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INT 研究者管理后台</title>
    <style>
        :root {
            --primary: #7C6FCD;
            --primary-dark: #6358B5;
            --accent: #52B788;
            --accent-dark: #3E9A6E;
            --bg: #F5F0FF;
            --surface: #FFFFFF;
            --text: #2D2A3E;
            --text-muted: #8A86A0;
            --border: #E8E4F0;
            --shadow: 0 4px 20px rgba(124,111,205,0.10);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC",
                         "Microsoft YaHei", sans-serif;
            background: linear-gradient(150deg, #F5F0FF 0%, #EFF7F2 100%);
            min-height: 100vh;
            color: var(--text);
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 顶栏 ===== */
        header {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            padding: 6px 14px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }

        .back-btn:hover { background: var(--bg); color: var(--primary); border-color: var(--primary); }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: rgba(124,111,205,0.1);
            color: var(--primary-dark);
            border: 1px solid rgba(124,111,205,0.2);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-export-all {
            padding: 8px 18px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(82,183,136,0.3);
            transition: opacity 0.15s, transform 0.15s;
        }

        .btn-export-all:hover { opacity: 0.88; transform: translateY(-1px); }

        /* ===== 主体 ===== */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* ===== 统计卡片 ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px 22px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-dark);
            line-height: 1.1;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ===== 搜索栏 ===== */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 9px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--surface);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124,111,205,0.10);
        }

        .search-input::placeholder { color: #C0BCCE; }

        /* ===== 表格 ===== */
        .table-wrap {
            background: var(--surface);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: rgba(124,111,205,0.06);
            color: var(--primary-dark);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(124,111,205,0.03); }

        td {
            padding: 13px 16px;
            font-size: 14px;
            vertical-align: middle;
        }

        .td-id {
            position: relative;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 12px;
            color: var(--text-muted);
        }

        .session-short {
            cursor: default;
            border-bottom: 1px dotted rgba(124,111,205,0.35);
        }

        .session-full {
            display: none;
            position: absolute;
            left: 12px;
            top: 34px;
            z-index: 50;
            max-width: min(420px, 70vw);
            padding: 8px 10px;
            border: 1px solid rgba(124,111,205,0.22);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            box-shadow: 0 8px 24px rgba(45,42,62,0.14);
            white-space: normal;
            word-break: break-all;
            line-height: 1.45;
        }

        .td-id:hover .session-full,
        .td-id:focus-within .session-full {
            display: block;
        }

        .td-participant {
            font-weight: 600;
            color: var(--text);
        }

        .stage-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(82,183,136,0.12);
            color: var(--accent-dark);
            border: 1px solid rgba(82,183,136,0.22);
            white-space: nowrap;
        }

        .td-preview {
            max-width: 200px;
            color: var(--text-muted);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .td-date { color: var(--text-muted); font-size: 13px; white-space: nowrap; }

        .btn-view, .btn-export {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.15s;
            border: none;
        }

        .btn-view {
            background: rgba(124,111,205,0.1);
            color: var(--primary-dark);
            border: 1px solid rgba(124,111,205,0.2);
        }

        .btn-export {
            background: rgba(82,183,136,0.1);
            color: var(--accent-dark);
            border: 1px solid rgba(82,183,136,0.2);
        }

        .btn-view:hover, .btn-export:hover { opacity: 0.75; transform: translateY(-1px); }

        .actions-cell { display: flex; gap: 6px; align-items: center; }

        /* ===== 展开的对话详情 ===== */
        .detail-row { display: none; }

        .detail-row.open { display: table-row; }

        .detail-cell {
            padding: 0 16px 16px;
            background: rgba(245,240,255,0.5);
        }

        .turn-list {
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 12px;
        }

        .turn-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .turn-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .turn-client { color: #2D2A3E; font-size: 14px; }
        .turn-therapist { color: var(--primary-dark); font-size: 14px; }
        .turn-meta { font-size: 11px; color: var(--text-muted); }
        .turn-trace {
            margin-top: 8px;
            padding: 10px 12px;
            background: rgba(124,111,205,0.06);
            border: 1px solid rgba(124,111,205,0.12);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .turn-trace summary {
            cursor: pointer;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .turn-trace pre {
            margin-top: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 11px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state p { font-size: 15px; margin-top: 8px; }

        /* ===== Loading ===== */
        .loading {
            text-align: center;
            padding: 48px;
            color: var(--text-muted);
        }

        /* ===== 语言按钮 ===== */
        .lang-toggle {
            padding: 5px 13px;
            background: rgba(124,111,205,0.08);
            color: var(--primary);
            border: 1.5px solid rgba(124,111,205,0.2);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }

        .lang-toggle:hover { background: rgba(124,111,205,0.15); }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="/" class="back-btn">← 返回咨询</a>
        <h1 id="page-title">研究者管理后台</h1>
    </div>
    <div class="header-right">
        <span class="badge" id="session-count-badge">— 个会话</span>
        <button class="lang-toggle" id="lang-btn" onclick="toggleLang()">EN</button>
        <button class="btn-export-all" onclick="exportAll()">导出全部</button>
    </div>
</header>

<main>
    <!-- 统计卡片 -->
    <div class="stats-row" id="stats-row">
        <div class="stat-card">
            <div class="stat-value" id="stat-total">—</div>
            <div class="stat-label" id="stat-total-label">总会话数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-participants">—</div>
            <div class="stat-label" id="stat-participants-label">参与者数</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-turns">—</div>
            <div class="stat-label" id="stat-turns-label">总对话轮次</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-avg">—</div>
            <div class="stat-label" id="stat-avg-label">平均轮次/会话</div>
        </div>
    </div>

    <!-- 搜索 -->
    <div class="toolbar">
        <input type="text" class="search-input" id="search-input"
               placeholder="按参与者编号或 Session ID 搜索…"
               oninput="filterTable()">
    </div>

    <!-- 表格 -->
    <div class="table-wrap">
        <div class="loading" id="loading">加载中…</div>
        <table id="sessions-table" style="display:none">
            <thead>
                <tr>
                    <th>Session ID</th>
                    <th id="th-participant">参与者</th>
                    <th id="th-stage">阶段</th>
                    <th id="th-turns">轮次</th>
                    <th id="th-preview">最后输入</th>
                    <th id="th-updated">更新时间</th>
                    <th id="th-actions">操作</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
        <div class="empty-state hidden" id="empty-state">
            <div style="font-size:40px">📭</div>
            <p id="empty-msg">暂无会话数据</p>
        </div>
    </div>
</main>

<script>
    const STAGE_ZH = {
        "trust building": "建立信任",
        "problem externalization": "问题外化",
        "re-authoring": "重述故事",
        "re-membering": "重组关系",
    };
    const STAGE_EN = {
        "trust building": "Trust Building",
        "problem externalization": "Problem Externalization",
        "re-authoring": "Re-authoring",
        "re-membering": "Re-membering",
    };

    let lang = localStorage.getItem("lang") || "zh";
    let allSessions = [];
    let expandedRow = null;

    function t(zh, en) { return lang === "zh" ? zh : en; }

    function toggleLang() {
        lang = lang === "zh" ? "en" : "zh";
        localStorage.setItem("lang", lang);
        document.getElementById("lang-btn").textContent = lang === "zh" ? "EN" : "中";
        applyLang();
        renderTable(filterSessions());
    }

    function applyLang() {
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.title = t("INT 研究者管理后台", "INT Research Admin");
        document.getElementById("page-title").textContent = t("研究者管理后台", "Research Admin");
        document.querySelector(".back-btn").textContent = t("← 返回咨询", "← Back");
        document.querySelector(".btn-export-all").textContent = t("导出全部", "Export All");
        document.getElementById("search-input").placeholder = t(
            "按参与者编号或 Session ID 搜索…",
            "Search by participant ID or session ID…"
        );
        document.getElementById("th-participant").textContent = t("参与者", "Participant");
        document.getElementById("th-stage").textContent = t("阶段", "Stage");
        document.getElementById("th-turns").textContent = t("轮次", "Turns");
        document.getElementById("th-preview").textContent = t("最后输入", "Last Input");
        document.getElementById("th-updated").textContent = t("更新时间", "Updated");
        document.getElementById("th-actions").textContent = t("操作", "Actions");
        document.getElementById("stat-total-label").textContent = t("总会话数", "Total Sessions");
        document.getElementById("stat-participants-label").textContent = t("参与者数", "Participants");
        document.getElementById("stat-turns-label").textContent = t("总对话轮次", "Total Turns");
        document.getElementById("stat-avg-label").textContent = t("平均轮次", "Avg Turns");
        document.getElementById("empty-msg").textContent = t("暂无会话数据", "No sessions yet");
        document.getElementById("loading").textContent = t("加载中…", "Loading…");

        const badge = document.getElementById("session-count-badge");
        if (allSessions.length) {
            updateTableState(filterSessions());
        }
    }

    function formatDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        return d.toLocaleString(lang === "zh" ? "zh-CN" : "en-US", {
            month: "short", day: "numeric",
            hour: "2-digit", minute: "2-digit"
        });
    }

    async function loadSessions() {
        try {
            const resp = await fetch("/api/sessions");
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            allSessions = await resp.json();
            renderStats();
            renderTable(allSessions);
            document.getElementById("loading").style.display = "none";
            document.getElementById("sessions-table").style.display = allSessions.length ? "table" : "none";
            document.getElementById("empty-state").classList.toggle("hidden", allSessions.length > 0);
            document.getElementById("session-count-badge").textContent =
                allSessions.length + t(" 个会话", " sessions");
        } catch (e) {
            document.getElementById("loading").textContent = t("加载失败，请刷新重试", "Load failed, refresh to retry");
        }
    }

    function renderStats() {
        const total = allSessions.length;
        const participants = new Set(allSessions.map(s => s.participant_id).filter(Boolean)).size;
        const totalTurns = allSessions.reduce((acc, s) => acc + (s.turn_count || 0), 0);
        const avg = total ? (totalTurns / total).toFixed(1) : "0";
        document.getElementById("stat-total").textContent = total;
        document.getElementById("stat-participants").textContent = participants;
        document.getElementById("stat-turns").textContent = totalTurns;
        document.getElementById("stat-avg").textContent = avg;
    }

    function filterSessions() {
        const q = normalizeSearchText(document.getElementById("search-input").value);
        if (!q) return allSessions;
        return allSessions.filter(s => sessionMatchesQuery(s, q));
    }

    function filterTable() {
        const sessions = filterSessions();
        renderTable(sessions);
        updateTableState(sessions);
    }

    function normalizeSearchText(value) {
        return String(value || "")
            .trim()
            .toLowerCase()
            .replace(/[._-]/g, "")
            .replace(/\s+/g, "");
    }

    function sessionMatchesQuery(s, q) {
        const fullId = normalizeSearchText(s.id);
        const shortId = normalizeSearchText((s.id || "").slice(0, 8));
        const participant = normalizeSearchText(s.participant_id);

        if (q.length === 1) {
            return participant === q || fullId.startsWith(q) || shortId.startsWith(q);
        }
        if (fullId.includes(q) || shortId.includes(q)) return true;
        if (participant.includes(q)) return true;

        if (q.length < 2) return false;
        const zhStage = STAGE_ZH[s.stage] || "";
        const enStage = STAGE_EN[s.stage] || "";
        return [
            s.id,
            s.stage,
            zhStage,
            enStage,
            s.preview,
            s.updated_at,
        ].map(normalizeSearchText).some(field => field.includes(q));
    }

    function updateTableState(sessions) {
        const count = sessions.length;
        const hasQuery = !!document.getElementById("search-input").value.trim();
        document.getElementById("loading").style.display = "none";
        document.getElementById("sessions-table").style.display = count ? "table" : "none";
        document.getElementById("empty-state").classList.toggle("hidden", count > 0);
        document.getElementById("empty-msg").textContent = hasQuery
            ? t("没有匹配的会话", "No matching sessions")
            : t("暂无会话数据", "No sessions yet");
        document.getElementById("session-count-badge").textContent = hasQuery
            ? `${count}/${allSessions.length}` + t(" 个会话", " sessions")
            : allSessions.length + t(" 个会话", " sessions");
    }

    function renderTable(sessions) {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        expandedRow = null;

        sessions.forEach(s => {
            const stageLabel = (lang === "zh" ? STAGE_ZH : STAGE_EN)[s.stage] || s.stage || "—";
            const participant = s.participant_id || t("（匿名）", "(Anonymous)");

            const tr = document.createElement("tr");
            tr.dataset.sid = s.id;
            tr.innerHTML = `
                <td class="td-id" title="${escapeHtml(s.id)}">
                    <span class="session-short" tabindex="0">${escapeHtml(s.id.slice(0, 8))}…</span>
                    <span class="session-full">${escapeHtml(s.id)}</span>
                </td>
                <td class="td-participant">${escapeHtml(participant)}</td>
                <td><span class="stage-badge">${escapeHtml(stageLabel)}</span></td>
                <td>${s.turn_count ?? 0}</td>
                <td class="td-preview">${escapeHtml(s.preview || "—")}</td>
                <td class="td-date">${formatDate(s.updated_at)}</td>
                <td>
                    <div class="actions-cell">
                        <button class="btn-view" onclick="toggleDetail('${s.id}')">${t("查看", "View")}</button>
                        <button class="btn-export" onclick="exportSession('${s.id}')">${t("导出", "Export")}</button>
                    </div>
                </td>`;
            tbody.appendChild(tr);

            // Detail row (hidden by default)
            const detailTr = document.createElement("tr");
            detailTr.className = "detail-row";
            detailTr.id = "detail-" + s.id;
            detailTr.innerHTML = `
                <td colspan="7" class="detail-cell">
                    <div class="turn-list" id="turns-${s.id}">
                        <div style="color:var(--text-muted);font-size:13px">${t("加载中…", "Loading…")}</div>
                    </div>
                </td>`;
            tbody.appendChild(detailTr);
        });
    }

    async function toggleDetail(sid) {
        const detailRow = document.getElementById("detail-" + sid);
        if (!detailRow) return;

        const isOpen = detailRow.classList.contains("open");
        // Close any open row
        if (expandedRow) expandedRow.classList.remove("open");
        if (isOpen) { expandedRow = null; return; }

        detailRow.classList.add("open");
        expandedRow = detailRow;

        const container = document.getElementById("turns-" + sid);
        try {
            const resp = await fetch("/api/session/" + sid);
            if (!resp.ok) throw new Error();
            const session = await resp.json();
            const turns = session.turns || [];

            if (!turns.length) {
                container.innerHTML = `<p style="color:var(--text-muted);font-size:13px">${t("暂无对话内容", "No turns yet")}</p>`;
                return;
            }

            container.innerHTML = turns.map(turn => `
                <div class="turn-item">
                    <span class="turn-label">${t("来访者", "Client")} · Round ${turn.round}</span>
                    <div class="turn-client">${escapeHtml(turn.client || "")}</div>
                    <span class="turn-label" style="margin-top:4px">${t("咨询师", "Therapist")} · ${escapeHtml((lang === "zh" ? STAGE_ZH : STAGE_EN)[turn.stage] || turn.stage || "")} / ${escapeHtml(turn.reflection_level || "")}</span>
                    <div class="turn-therapist">${escapeHtml(turn.therapist || "")}</div>
                    <div class="turn-meta">${turn.timestamp ? formatDate(turn.timestamp) : ""}</div>
                    ${turn.trace ? `<details class="turn-trace">
                        <summary>${t("INT 决策日志", "INT decision trace")}</summary>
                        <pre>${escapeHtml(JSON.stringify(turn.trace, null, 2))}</pre>
                    </details>` : ""}
                </div>
            `).join('<hr style="border:none;border-top:1px solid var(--border);margin:6px 0">');
        } catch {
            container.innerHTML = `<p style="color:var(--text-muted)">${t("加载失败", "Load failed")}</p>`;
        }
    }

    function exportSession(sid) {
        window.location.href = "/api/export/" + sid;
    }

    async function exportAll() {
        const sessions = filterSessions();
        for (const s of sessions) {
            // Open each in a new tab so multi-export doesn't navigate away
            window.open("/api/export/" + s.id, "_blank");
            await new Promise(r => setTimeout(r, 400));
        }
    }

    function escapeHtml(text) {
        const d = document.createElement("div");
        d.appendChild(document.createTextNode(String(text)));
        return d.innerHTML;
    }

    // ===== Admin Auth =====
    let adminKey = sessionStorage.getItem("admin_key") || "";

    function showAuthModal() {
        const overlay = document.createElement("div");
        overlay.id = "auth-overlay";
        overlay.style.cssText = `
            position:fixed;inset:0;background:rgba(45,42,62,0.55);
            display:flex;align-items:center;justify-content:center;z-index:999;
            backdrop-filter:blur(6px);
        `;
        overlay.innerHTML = `
            <div style="background:#fff;border-radius:24px;padding:40px 36px;max-width:380px;width:90%;
                        box-shadow:0 12px 48px rgba(124,111,205,0.25);text-align:center;">
                <div style="font-size:40px;margin-bottom:16px">🔑</div>
                <h2 style="font-size:20px;color:#6358B5;margin-bottom:8px">研究者入口</h2>
                <p style="font-size:14px;color:#8A86A0;margin-bottom:24px">请输入管理员密钥以访问后台</p>
                <input id="key-input" type="password" placeholder="Admin Key"
                    style="width:100%;padding:12px 16px;border:1.5px solid #E8E4F0;border-radius:12px;
                           font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;
                           box-sizing:border-box;">
                <div id="auth-error" style="color:#e05555;font-size:13px;min-height:20px;margin-bottom:8px"></div>
                <button id="auth-btn"
                    style="width:100%;padding:13px;background:linear-gradient(135deg,#7C6FCD,#6358B5);
                           color:white;border:none;border-radius:12px;font-size:15px;font-weight:600;
                           font-family:inherit;cursor:pointer;">进入后台</button>
            </div>`;
        document.body.appendChild(overlay);

        const input = document.getElementById("key-input");
        const btn = document.getElementById("auth-btn");
        const err = document.getElementById("auth-error");

        async function tryAuth() {
            const key = input.value.trim();
            if (!key) return;
            btn.disabled = true;
            btn.textContent = "验证中…";
            try {
                const resp = await fetch("/api/sessions?admin_key=" + encodeURIComponent(key));
                if (resp.ok) {
                    sessionStorage.setItem("admin_key", key);
                    adminKey = key;
                    overlay.remove();
                    allSessions = await resp.json();
                    renderStats();
                    renderTable(allSessions);
                    updateTableState(allSessions);
                } else {
                    err.textContent = "密钥错误，请重试";
                    btn.disabled = false;
                    btn.textContent = "进入后台";
                }
            } catch {
                err.textContent = "连接失败，请检查服务器";
                btn.disabled = false;
                btn.textContent = "进入后台";
            }
        }

        btn.addEventListener("click", tryAuth);
        input.addEventListener("keydown", e => { if (e.key === "Enter") tryAuth(); });
        setTimeout(() => input.focus(), 100);
    }

    async function loadSessionsWithAuth() {
        if (!adminKey) { showAuthModal(); return; }
        try {
            const resp = await fetch("/api/sessions?admin_key=" + encodeURIComponent(adminKey));
            if (resp.status === 401) { sessionStorage.removeItem("admin_key"); showAuthModal(); return; }
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            allSessions = await resp.json();
            renderStats();
            renderTable(allSessions);
            updateTableState(allSessions);
        } catch (e) {
            document.getElementById("loading").textContent = lang === "zh" ? "加载失败，请刷新重试" : "Load failed";
        }
    }

    // Init
    applyLang();
    loadSessionsWithAuth();
</script>
</body>
</html>
