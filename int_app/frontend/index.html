<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">INT 叙事咨询</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<!-- ===== 欢迎页 ===== -->
<div id="welcome-screen" class="welcome-screen">
    <div class="welcome-card">
        <button id="lang-btn-welcome" class="lang-toggle" aria-label="Switch language">EN</button>

        <div class="welcome-icon">🌱</div>
        <h1 data-i18n="title">INT 叙事咨询</h1>
        <p class="welcome-subtitle" data-i18n="subtitle">倾听你的故事，陪你重新书写生命</p>

        <div class="welcome-notice">
            <p data-i18n="notice">本系统是基于叙事疗法的 AI 辅助工具，仅作为研究用途，不能替代专业心理咨询。</p>
        </div>

        <input type="text" id="participant-id-input"
               data-i18n-placeholder="participantPlaceholder"
               placeholder="请输入您的参与者编号（可选）"
               class="participant-input">
        <button id="start-btn" class="start-btn" data-i18n="startBtn">开始对话</button>

        <!-- 历史对话 -->
        <div id="history-section" class="history-section hidden">
            <div class="history-divider">
                <span data-i18n="historyTitle">历史对话</span>
            </div>
            <div id="history-list" class="history-list"></div>
        </div>
    </div>
</div>

<!-- ===== 聊天页 ===== -->
<div id="chat-screen" class="chat-screen hidden">
    <header class="chat-header">
        <div class="header-title">
            <span class="header-icon">🌿</span>
            <span data-i18n="headerTitle">INT 叙事咨询</span>
        </div>
        <div class="header-actions">
            <button id="new-chat-btn" class="header-icon-btn" data-i18n-title="newChatTitle" title="新对话">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
            <button id="lang-btn-chat" class="lang-toggle" aria-label="Switch language">EN</button>
            <button id="export-btn" class="export-btn" title="导出对话记录">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span data-i18n="exportBtn">导出</span>
            </button>
        </div>
    </header>

    <div id="messages" class="messages-container"></div>

    <div class="input-area">
        <div id="message-input"
             class="message-input-div"
             contenteditable="true"
             data-i18n-placeholder="inputPlaceholder"
             data-placeholder="说说你的故事..."
             role="textbox"
             aria-multiline="true"
             aria-label="输入消息"></div>
        <button id="send-btn" class="send-btn" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
